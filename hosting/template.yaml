AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Static hosting for the Generic QuickSuite Widget sample — a private S3 bucket
  served over HTTPS via CloudFront using Origin Access Control (OAC).

Resources:

  WidgetBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WidgetOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WidgetDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Generic QuickSuite Widget sample hosting
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: s3origin
            DomainName: !GetAtt WidgetBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WidgetOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: s3origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          # Managed "CachingDisabled" policy — avoids stale config.json/JS while
          # iterating during testing. Switch to CachingOptimized for production.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          ResponseHeadersPolicyId: !Ref WidgetResponseHeadersPolicy

  # Security headers applied to every static asset (HTML/JS/JSON) served here.
  WidgetResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: SAMEORIGIN
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            # Scopes what the sample page may load. 'unsafe-inline' is required
            # because the widget injects scoped <style> blocks and the sample
            # host page uses an inline <script>; for stricter CSP, externalize
            # the host-page script and add per-request nonces (Lambda@Edge).
            # Note: the registered variant also needs the Cognito Hosted UI
            # domain reachable for the login redirect (a full-page navigation,
            # not governed by connect-src).
            ContentSecurityPolicy: >-
              default-src 'self';
              script-src 'self' 'unsafe-inline' https://unpkg.com;
              style-src 'self' 'unsafe-inline';
              img-src 'self' data: https:;
              font-src 'self' data:;
              connect-src 'self' https://*.amazonaws.com https://*.quicksight.aws.amazon.com https://*.amazoncognito.com;
              frame-src https://*.quicksight.aws.amazon.com https://*.amazonaws.com;
              frame-ancestors 'self';
              base-uri 'self';
              object-src 'none'
            Override: true

  WidgetBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WidgetBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WidgetBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${WidgetDistribution.Id}'

Outputs:
  BucketName:
    Description: S3 bucket holding the widget assets
    Value: !Ref WidgetBucket
  DistributionId:
    Description: CloudFront distribution ID
    Value: !Ref WidgetDistribution
  DistributionDomain:
    Description: CloudFront domain name
    Value: !GetAtt WidgetDistribution.DomainName
  WidgetUrl:
    Description: Widget URL
    Value: !Sub 'https://${WidgetDistribution.DomainName}/index.html'
